    "save_field_csv_default": false,
    "include_field_default": false,
    "sticky_material_override": true,
    "run_baseline": true,
    # Predictive arm. The tracked step above is a nowcast (track_observed_time
    # advances by elapsed time, so its radius is valid *at* the observation
    # time and carries no lead). These settings produce the genuine lookahead
    # the safety rules act on: two branches sampled over lookahead_hours, one
    # keeping the current pipe boundary and one with the heater setpoint forced
    # to lookahead_stop_setpoint_c. Costs ~440 ms of the 30 s update budget.
    # 1.0 h is the operating point from the warning-skill sweep (POD 1.00,
    # FAR 0.12 on the April 8 run) and carries the margin for the FEM's
    # observed tendency to predict the crossing late -- it is a margin, not a
    # calibration, and it is tuned on a single crossing.
    "enable_lookahead": true,
    "lookahead_hours": 1.0,
    "lookahead_samples": 12,
    "lookahead_stop_setpoint_c": 0.0,
    "pipe_boundary_set": "left"
  },
  "safety_monitor": {
    "thaw_input_queue": "permafrost.record.thaw_front.2d",
    "forecast_input_queue": "permafrost.record.fem_forecast.2d",
    "output_queue": "permafrost.record.safety_alerts.2d",
    "mode": "dual",
    # Calibrated against the April 8 experiment by
    # software/tools/safety_limit_calibration.py: measured r_max spans 0..44.2 mm
    # and r_min 0..29.4 mm. The sweep returned 38.8 mm; rounded to 40 mm, which
    # keeps the run walking the full ok -> warning -> critical -> alert ladder
    # (warn/critical/alert at 24/36/40 mm) with a round number to report.
    "limit_radius_m": 0.040,
    "limit_min_radius_m": 0.015,
    "warn_fraction": 0.6,
    "critical_fraction": 0.9,
    "metric": "max",
    "publish_on_change": false,
    "site_id": "default",
    # --- predictive mode (M1/M2/F1/F2) ---------------------------------------
    # Set "mode": "predictive" above to enable. "dual" is left as the default so
    # the published figures stay reproducible; the two engines are separate code
    # paths and dual is unchanged.
    #   M1  measured r_max >= limit_radius_m            -> alert / stop
    #   M2  measured r_max >= warn_fraction * limit     -> measurement elevated
    #   F1  forecast breaches within the lookahead horizon if heating continues
    #   F2  forecast breaches even if the heater is cut now -> f2_action
    # Stop trips on 1-of-2 (M1 or F2); heating continues only on 2-of-2
    # agreement; "reduce" (M2 and F1) is the one action that needs both.
    #
    # Confirmation applies to F1/F2 only -- 3 updates at 30 s cadence is 90 s.
    # A measured breach is never debounced.
    "confirm_updates": 3,
    # Release band for the measured "elevated" latch, as a fraction of the
    # limit. Clamped at or below warn_fraction by the server.
    "release_fraction": 0.5,
    # Staleness in DATA time (both streams carry time_hours), so replay is
    # deterministic. 0.05 h = 3 min = 6 sensor cadences.
    "forecast_max_age_hours": 0.05,
    "measurement_max_age_hours": 0.05,
    # Asymmetric degradation: a stale forecast falls back to the measured
    # ladder, a stale measurement fails safe. Losing the prediction costs lead
    # time; losing the measurement means flying blind on the reference signal.
    "fail_safe_on_stale_measurement": true,
    # Thaw does not reverse on this timescale, so r_max never comes back down
    # and an auto-release would only ever fire on reconstruction noise. Cleared
    # by an operator via SafetyMonitorServer.clear_latch().
    "latch_alert": true,
    # "stop" is the defensible reading of "stopping later will no longer work",
    # and it is where the 71 min of lead comes from. Set to "reduce" if the
    # model alone should never cut the heater.
    "f2_action": "stop"
  },
  "heater_actuation": {
